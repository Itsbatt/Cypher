name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: cypher-release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Attach SHA256SUMS.txt to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern "*.apk" || true
          if compgen -G "release-assets/*.apk" > /dev/null; then
            (cd release-assets && sha256sum *.apk) > SHA256SUMS.txt
            gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          else
            echo "No APK assets on $GITHUB_REF_NAME; skipping checksum upload"
          fi
